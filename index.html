<!doctype html>

<head>

  <link rel="manifest" href="manifest.webmanifest"><title>Abbey Road 在庫</title>
  <style>
    :root{--bg:#fff8fb;--paper:#fff;--ink:#665b68;--muted:#aa98a9;--gold:#fff2cf;--gold-line:#f0d997;--silver:#e9f5f4;--silver-line:#b9deda;--alert:#fff0f2;--alert-line:#e8b4c1;--shadow:0 7px 20px #c99fb31f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at 12% 8%,#fff 0 12%,transparent 34%),linear-gradient(180deg,#fff8fb,#fdf4f8 48%,#f3f8ee);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;padding:env(safe-area-inset-top) 14px calc(82px + env(safe-area-inset-bottom));position:relative}body:before{content:"✦   ˚   ✦";position:fixed;top:10px;right:16px;color:#efc8d5;font-size:18px;letter-spacing:8px;pointer-events:none}header{max-width:680px;margin:auto;padding:22px 4px 14px;position:sticky;top:0;background:#fff8fbe6;backdrop-filter:blur(12px);z-index:2;border-radius:0 0 28px 28px}.brand{display:flex;align-items:center;gap:11px}.mark{width:46px;height:46px;border-radius:18px 22px 20px 24px;background:#f7c8d8;display:grid;place-items:center;font-size:23px;box-shadow:3px 4px 0 #e7aebf;color:#fff}.brand h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.08em;color:#6a596b}.stats{display:flex;gap:14px;margin-top:14px;font-size:12px;color:#9b8497}.stats strong{color:#65556a;font-size:15px;margin-right:2px}.stats .attention strong{color:#cf8299}main{max-width:680px;margin:auto}.card{background:var(--paper);border:2px solid #f0dfe7;border-radius:26px;padding:16px;margin:12px 0;box-shadow:var(--shadow);position:relative}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sku{font-weight:800;font-size:16px;color:#715f72}.meta{font-size:12px;color:var(--muted);margin-top:3px}.variants{display:grid;grid-template-columns:1fr 1fr;gap:10px}.variant{border:2px solid var(--gold-line);background:var(--gold);border-radius:20px;padding:11px 8px 10px;text-align:center}.variant.silver{background:var(--silver);border-color:var(--silver-line)}.variant.alert{background:var(--alert);border-color:var(--alert-line)}.label{font-size:11px;color:#b29359;font-weight:800}.silver .label{color:#77a7a1}.alert .label{color:#c77d8d}.stock-row{display:flex;justify-content:center;align-items:center;gap:9px;margin:7px 0}.stock-btn{width:42px;height:42px;border-radius:16px;border:2px solid #c8aeca;background:#fff9;color:var(--ink);font-size:22px;line-height:1;touch-action:manipulation}.stock-btn:active{transform:scale(.93);background:#fff}.stock{min-width:34px;font-size:28px;font-weight:800;color:#6e5e72}.hint{font-size:11px;color:#b09bad;min-height:16px}.alert .hint{color:#c77d8d;font-weight:800}.ordered{display:inline-flex;align-items:center;gap:5px;border:2px solid #e1b5c0;border-radius:99px;padding:6px 10px;margin-top:5px;background:#fff8fa;color:#b36e81;font-size:11px;font-weight:800;min-height:32px}.ordered.checked{background:#e5f3df;border-color:#a8c99c;color:#668b61}.ordered input{width:16px;height:16px;accent-color:#8ebd82;margin:0}.settings{max-width:680px;margin:16px auto 0;background:#fff9fddd;border-radius:22px;padding:13px 15px;border:2px solid #f0dfe7;color:#a489a0;font-size:12px}.settings summary{cursor:pointer;color:#725f73;font-weight:800}.settings p{margin:10px 0 0}.threshold{width:54px;border:0;border-bottom:2px dotted #d6afc1;background:transparent;text-align:center;font:inherit;color:var(--ink);font-weight:800;padding:3px}.bottom{position:fixed;bottom:0;left:0;right:0;padding:11px 14px calc(11px + env(safe-area-inset-bottom));background:#fff8fbed;backdrop-filter:blur(14px);text-align:center;color:#a489a0;font-size:11px;z-index:3}.empty{padding:30px;text-align:center;color:var(--muted)}@media(min-width:600px){body{padding-left:24px;padding-right:24px}.card{padding:18px}}
  .lock{position:fixed;inset:0;z-index:20;background:linear-gradient(160deg,#fff8fb,#f3f8ee);display:grid;place-items:center;padding:24px}.lock-box{width:min(330px,100%);background:#fff;border:2px solid #f0dfe7;border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 12px 34px #c99fb333}.lock-mark{font-size:32px;color:#efb8c9;margin-bottom:8px}.lock h2{font-size:20px;color:#715f72;margin:0 0 8px}.lock p{font-size:12px;color:#a489a0;margin:0 0 18px}.lock input{width:100%;height:48px;border:2px solid #e1c4d0;border-radius:15px;text-align:center;font-size:22px;letter-spacing:.3em;color:#665b68}.lock button{margin-top:12px;width:100%;height:46px;border:0;border-radius:15px;background:#f7c8d8;color:#715466;font-size:15px;font-weight:800}.lock-error{height:18px;color:#c77d8d;font-size:12px;margin-top:8px}
  </style>
</head>
<body><div class="lock" id="lock"><div class="lock-box"><div class="lock-mark">✦</div><h2>XP-49在庫</h2><p>暗証番号を入力してください</p><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="暗証番号"><button onclick="unlock()">ひらく</button><div class="lock-error" id="lockError"></div></div></div><header><div class="brand"><div class="mark">✦</div><div><h1>XP-49在庫</h1></div></div><div class="stats"><span>全 <strong id="total">22</strong> SKU</span><span class="attention">目安以下 <strong id="alerts">0</strong> 件</span></div></header><main id="app"></main><details class="settings"><summary>使い方</summary><p>在庫は −／＋ で変更できます。発注目安の数字をタップして商品ごとに設定できます。「仕入済」はいつでも表示され、状態を保存します。</p></details><div class="bottom">数字と仕入済の状態はこの端末に自動保存されます</div>
<script>
const ITEMS=[['XP-49BF','チョコ',10],['XP-49AF','黒',10],['XP-49BH','チョコ',11],['XP-49AH','黒',11],['XP-49BI','チョコ',12],['XP-49AI','黒',12],['XP-49BJ','チョコ',13],['XP-49AJ','黒',13],['XP-49BL','チョコ',14],['XP-49AL','黒',14],['XP-49BM','チョコ',15],['XP-49AM','黒',15],['XP-49BN','チョコ',16],['XP-49AN','黒',16],['XP-49BO','チョコ',17],['XP-49AO','黒',17],['XP-49BP','チョコ',18],['XP-49AP','黒',18],['XP-49BR','チョコ',19],['XP-49AR','黒',19],['XP-49BS','チョコ',20],['XP-49AS','黒',20]];
const PIN='2468';const KEY='abbeyroad-xp49-inventory-v2';let data=JSON.parse(localStorage.getItem(KEY)||'{}');const get=(sku,k)=>data[sku]?.[k]??(k.endsWith('Threshold')?5:k.endsWith('Ordered')?false:0);function unlock(){const input=document.querySelector('#pin');if(input.value===PIN){document.querySelector('#lock').remove();sessionStorage.setItem('xp49-unlocked','1')}else{document.querySelector('#lockError').textContent='暗証番号が違います';input.value='';input.focus()}}document.querySelector('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});if(sessionStorage.getItem('xp49-unlocked')==='1')document.querySelector('#lock').remove();function save(){localStorage.setItem(KEY,JSON.stringify(data))}function change(sku,k,d){data[sku]??={};data[sku][k]=Math.max(0,get(sku,k)+d);save();render()}function threshold(sku,k,v){data[sku]??={};data[sku][k]=Math.max(0,Number.parseInt(v||0,10)||0);save();render()}function toggle(sku,k){data[sku]??={};data[sku][k]=!get(sku,k);save();render()}function variant(sku,key,label){let st=get(sku,key+'Stock'),th=get(sku,key+'Threshold'),ord=get(sku,key+'Ordered'),alert=st<=th;return `<section class="variant ${key==='silver'?'silver ':''}${alert?'alert':''}"><div class="label">${label}</div><div class="stock-row"><button class="stock-btn" aria-label="${label}を1減らす" onclick="change('${sku}','${key}Stock',-1)">−</button><div class="stock">${st}</div><button class="stock-btn" aria-label="${label}を1増やす" onclick="change('${sku}','${key}Stock',1)">＋</button></div><div class="hint">発注目安 <input class="threshold" type="number" inputmode="numeric" min="0" value="${th}" aria-label="${label}の発注目安" onchange="threshold('${sku}','${key}Threshold',this.value)"> 本</div><label class="ordered ${ord?'checked':''}"><input type="checkbox" ${ord?'checked':''} onchange="toggle('${sku}','${key}Ordered')">${ord?'仕入済 ✓':'仕入済'}</label></section>`}function render(){let alerts=0;document.querySelector('#app').innerHTML=ITEMS.map(([sku,color,size])=>{let a=get(sku,'goldStock')<=get(sku,'goldThreshold'),b=get(sku,'silverStock')<=get(sku,'silverThreshold');alerts+=a+b;return `<article class="card"><div class="card-head"><div><div class="sku">${sku}</div><div class="meta">${size}mm · ${color}</div></div></div><div class="variants">${variant(sku,'gold','ゴールド')}${variant(sku,'silver','シルバー')}</div></article>`}).join('');document.querySelector('#alerts').textContent=alerts}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
